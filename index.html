    <style>
        :root {
            --bg-color: #080402;
            --card-bg: rgba(23, 13, 8, 0.7);
            --primary-fire: #ff4500;
            --secondary-orange: #ff6600;
            --bright-gold: #ffb700;
            --glow-color: rgba(255, 69, 0, 0.4);
            --text-color: #f5f5f5;
            --text-muted: #a3958c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 69, 0, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 183, 0, 0.05), transparent 40%);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Passwort-Overlay */
        #protected-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 69, 0, 0.2), transparent 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .lock-card {
            background: rgba(20, 10, 5, 0.95);
            border: 2px solid rgba(255, 102, 0, 0.5);
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.3);
        }

        .lock-card h2 {
            color: var(--bright-gold);
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .lock-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .lock-card input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 102, 0, 0.5);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        .lock-card input:focus {
            border-color: var(--bright-gold);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .lock-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-fire), var(--bright-gold));
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .lock-btn:hover {
            transform: scale(1.02);
        }

        .error-msg {
            color: #ff4500;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Top Navigation Bar */
        nav {
            width: 100%;
            max-width: 1200px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 69, 0, 0.2);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 4, 2, 0.9);
        }

        .nav-brand {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .nav-brand span {
            color: var(--primary-fire);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .putlitz-btn {
            background: linear-gradient(135deg, #ff6600, #ffaa00);
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
        }

        .putlitz-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.8);
            background: linear-gradient(135deg, #ffaa00, #ffffff);
        }
