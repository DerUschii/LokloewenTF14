<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triebfahrzeugführer 2026 Klasse 14 - Intern</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080402;
            --card-bg: rgba(23, 13, 8, 0.7);
            --primary-fire: #ff4500;
            --secondary-orange: #ff6600;
            --bright-gold: #ffb700;
            --glow-color: rgba(255, 69, 0, 0.4);
            --text-color: #f5f5f5;
            --text-muted: #a3958c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 69, 0, 0.15), transparent 50%);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%; max-width: 1200px; padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 69, 0, 0.2);
            background: rgba(8, 4, 2, 0.9); position: sticky; top: 0; z-index: 100;
        }
        .nav-brand { font-size: 1.1rem; font-weight: 800; color: #fff; text-transform: uppercase; }
        .nav-brand span { color: var(--primary-fire); }
        .hero { text-align: center; padding: 40px 20px; }
        h1 { font-size: 2.2rem; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .main-container { max-width: 1100px; width: 100%; padding: 20px; }
        .trainer-card { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 102, 0, 0.3); border-radius: 12px; padding: 35px; text-align: center; margin-top: 30px; }
        .trainer-question { font-size: 1.3rem; color: var(--bright-gold); font-weight: bold; margin-bottom: 10px; }
        .trainer-hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; font-style: italic; }
        .trainer-input { width: 100%; max-width: 600px; padding: 15px; background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 102, 0, 0.5); border-radius: 8px; color: #fff; font-size: 1rem; text-align: center; margin-bottom: 20px; outline: none; }
        .send-btn { background: linear-gradient(135deg, var(--primary-fire), var(--bright-gold)); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .trainer-feedback { margin-top: 15px; font-size: 1.1rem; font-weight: bold; min-height: 30px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">Triebfahrzeugführer <span>2026</span> Klasse 14</div>
    </nav>

    <header class="hero">
        <h1>Wortlaut-Trainer (Strenger Modus)</h1>
        <p style="color: var(--text-muted);">Jetzt werden deine Antworten echten Prüfungen unterzogen.</p>
    </header>

    <main class="main-container">
        <div class="trainer-card">
            <div style="color: var(--bright-gold); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px;">
                <i class="fas fa-graduation-cap"></i> Regelwerk Wortlaut-Trainer
            </div>
            
            <div id="trainerQuestionBox" class="trainer-question">Lade Frage...</div>
            <div id="trainerHintBox" class="trainer-hint"></div>
            
            <input type="text" id="trainerAnswerInput" class="trainer-input" placeholder="Exakte Antwort eingeben..." onkeypress="handleTrainerPress(event)"><br>
            <button class="send-btn" onclick="checkTrainerAnswer()">Antwort prüfen</button>
            
            <div id="trainerFeedback" class="trainer-feedback"></div>
            <div id="trainerStats" style="margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;"></div>
        </div>
    </main>

    <script>
        const trainerQuestions = [
            { 
                question: "Wie lautet die Definition einer Rangierfahrt?", 
                hint: "Tipp: Achte auf Begriffe wie Fahrbewegung, kleine und Weichen.",
                keywords: ["fahrbewegung", "weiche"] // Muss mindestens diese Wörter enthalten
            },
            { 
                question: "Was versteht man unter einer Zugfahrt?", 
                hint: "Tipp: Achte auf Fahrbewegung, Zug und Streckengleis.",
                keywords: ["fahrbewegung", "streckengleis"] 
            },
            { 
                question: "Bis zu welcher Geschwindigkeit gilt im Regelfall die Rangierfahrt?", 
                hint: "Tipp: Nenne die konkrete Höchstgeschwindigkeit.",
                keywords: ["25"] 
            }
        ];

        let currentTrainerIndex = 0;

        function loadTrainerQuestion() {
            const qBox = document.getElementById('trainerQuestionBox');
            const hintBox = document.getElementById('trainerHintBox');
            const statsBox = document.getElementById('trainerStats');
            const feedbackBox = document.getElementById('trainerFeedback');
            
            qBox.textContent = trainerQuestions[currentTrainerIndex].question;
            hintBox.textContent = trainerQuestions[currentTrainerIndex].hint;
            statsBox.textContent = `Frage ${currentTrainerIndex + 1} von ${trainerQuestions.length}`;
            document.getElementById('trainerAnswerInput').value = "";
            feedbackBox.textContent = "";
        }

        function checkTrainerAnswer() {
            const userAns = document.getElementById('trainerAnswerInput').value.toLowerCase().trim();
            const feedbackBox = document.getElementById('trainerFeedback');
            const currentQ = trainerQuestions[currentTrainerIndex];

            if (userAns === "") {
                feedbackBox.style.color = "#ffb700";
                feedbackBox.textContent = "Bitte gib eine Antwort ein!";
                return;
            }

            // Prüfen, ob ALLE erforderlichen Schlüsselwörter vorkommen
            let allKeywordsFound = true;
            currentQ.keywords.forEach(keyword => {
                if (!userAns.includes(keyword)) {
                    allKeywordsFound = false;
                }
            });

            if (allKeywordsFound) {
                feedbackBox.style.color = "#00ff66";
                feedbackBox.textContent = "✔ Richtig! Perfekter Wortlaut.";
                setTimeout(() => {
                    currentTrainerIndex = (currentTrainerIndex + 1) % trainerQuestions.length;
                    loadTrainerQuestion();
                }, 2500);
            } else {
                feedbackBox.style.color = "#ff4500";
                feedbackBox.textContent = "✘ Falsch oder unvollständig. Dir fehlen wichtige Schlüsselbegriffe!";
            }
        }

        function handleTrainerPress(event) {
            if (event.key === 'Enter') checkTrainerAnswer();
        }

        window.onload = function() {
            loadTrainerQuestion();
        };
    </script>
</body>
</html>
