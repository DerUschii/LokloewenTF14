<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loklöwenwelpen Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .welcome-text {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .chat-messages {
            border: 1px solid #ddd;
            border-radius: 4px;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #e2e8f0;
            word-wrap: break-word;
        }
        .message span {
            font-weight: bold;
            display: block;
            font-size: 0.8rem;
            color: #4a5568;
            margin-bottom: 2px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 10px 20px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .footer-links {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: auto;
        }
        .footer-links a {
            color: #3182ce;
            text-decoration: none;
            margin: 0 5px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h1>Loklöwenwelpen Chat</h1>
        <div class="welcome-text">Willkommen im Loklöwenwelpen Chat der Klasse 14! Wenn Ihr Welpen seid, dann schnackt einfach, wenn Ihr Interessenten seid, dann fragt uns!</div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- Nachrichten werden hier angezeigt -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="usernameInput" placeholder="Dein Name..." style="max-width: 120px;">
            <input type="text" id="messageInput" placeholder="Schreibe eine Nachricht..." autofocus>
            <button onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <div class="footer-links">
        <a href="https://webmail.strato.de" target="_blank">Strato</a> | 
        <a href="#" target="_blank">Publisher</a> | 
        <a href="https://lernwelt-lokloewen.de/login" target="_blank">Lernwelten</a>
    </div>

    <script>
        // Einfache lokale Chat-Funktion (Simulation für den Anfang)
        function sendMessage() {
            const usernameInput = document.getElementById('usernameInput');
            const messageInput = document.getElementById('messageInput');
            const chatMessages = document.getElementById('chatMessages');

            if (messageInput.value.trim() === '') return;

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            const userSpan = document.createElement('span');
            userSpan.textContent = usernameInput.value.trim() !== '' ? usernameInput.value.trim() : 'Anonym';

            const textNode = document.createTextNode(messageInput.value);

            messageDiv.appendChild(userSpan);
            messageDiv.appendChild(textNode);
            chatMessages.appendChild(messageDiv);

            // Nach unten scrollen
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Eingabefeld für Nachricht leeren
            messageInput.value = '';
        }

        // Auch mit Enter-Taste abschicken
        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
